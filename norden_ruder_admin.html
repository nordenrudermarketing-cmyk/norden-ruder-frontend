<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路得行旅｜問卷後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --brand:#70705c;--brand-light:#e0ddd0;--brand-dark:#4a4a3a;
  --gray:#9a9a80;--border:#d0cdc0;--bg:#e8e5d5;--card:#f2f0e6;
  --text:#70705c;--text2:#4a4a3a;
  --success:#6a8a6a;--success-light:#eef2ee;
  --danger:#a05050;--danger-light:#f5eeee;
}
body{font-family:'Noto Serif TC',Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;}
.layout{display:flex;min-height:100vh;}
.sidebar{width:200px;background:var(--brand-dark);padding:1.5rem 0;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar-logo{padding:0 1.25rem 1.5rem;border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-logo-name{font-size:13px;font-weight:700;color:#f2f0e6;line-height:1.3;letter-spacing:0.5px;}
.sidebar-logo-sub{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px;font-family:Georgia,serif;}
.nav{padding:1rem 0;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 1.25rem;font-size:13px;color:rgba(255,255,255,0.65);cursor:pointer;transition:all 0.15s;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#f2f0e6;}
.nav-item.active{background:rgba(255,255,255,0.12);color:#f2f0e6;border-left-color:#f2f0e6;}
.nav-icon{font-size:16px;width:18px;text-align:center;}
.sidebar-branch{padding:1rem 1.25rem;border-top:1px solid rgba(255,255,255,0.1);}
.branch-label{font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
.branch-select{width:100%;padding:6px 8px;font-size:12px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#f2f0e6;cursor:pointer;font-family:'Noto Serif TC',Georgia,serif;}
.branch-select option{background:var(--brand-dark);color:#f2f0e6;}
.main{flex:1;overflow-y:auto;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0.875rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.topbar-title{font-size:16px;font-weight:600;color:var(--text2);}
.topbar-time{font-size:12px;color:var(--gray);font-family:Georgia,serif;}
.content{padding:1.5rem;}
.page{display:none;}
.page.active{display:block;}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:1.5rem;}
.stat-card{background:var(--card);border-radius:10px;padding:1rem 1.25rem;border:1px solid var(--border);}
.stat-label{font-size:12px;color:var(--gray);margin-bottom:4px;}
.stat-val{font-size:26px;font-weight:700;color:var(--text2);font-family:Georgia,serif;}
.stat-sub{font-size:11px;color:var(--gray);margin-top:2px;}
.table-card{background:var(--card);border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:1.25rem;}
.table-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);}
.table-title{font-size:14px;font-weight:600;color:var(--text2);}
.search-input{padding:7px 12px;font-size:13px;border:1px solid var(--border);border-radius:8px;font-family:'Noto Serif TC',Georgia,serif;color:var(--text);width:100%;margin:0.75rem 1rem 0;width:calc(100% - 2rem);background:var(--bg);}
.search-input:focus{outline:none;border-color:var(--brand);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{padding:10px 1rem;text-align:left;font-size:11px;font-weight:600;color:var(--gray);border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:0.5px;}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--brand-light);}
td{padding:10px 1rem;color:var(--text2);vertical-align:middle;}
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;}
.badge.taichung,.badge.tc{background:#e8e0d0;color:#6a5a40;}
.badge.taitung1,.badge.tt1{background:#dde8e0;color:#405a48;}
.badge.taitung2,.badge.tt2{background:#dde0e8;color:#404860;}
.star-small{color:#b5a070;font-size:12px;}
.praise-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.5rem;}
.praise-card{background:var(--card);border-radius:10px;padding:1rem;border:1px solid var(--border);}
.praise-name{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--text2);}
.praise-count{font-size:24px;font-weight:700;color:var(--brand);font-family:Georgia,serif;}
.praise-label{font-size:11px;color:var(--gray);}
.praise-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden;}
.praise-fill{height:100%;background:var(--brand);border-radius:2px;}
.empty{text-align:center;padding:3rem 1rem;color:var(--gray);}
.empty-icon{font-size:40px;margin-bottom:0.75rem;}
.empty-text{font-size:14px;}
.filter-row{display:flex;gap:8px;margin-top:0.75rem;}
.filter-btn{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--gray);cursor:pointer;font-family:'Noto Serif TC',Georgia,serif;}
.filter-btn.on{background:var(--brand-light);color:var(--brand);border-color:var(--brand);}
.praise-type-row{display:flex;gap:8px;margin-bottom:1.25rem;}
.comment-item{padding:0.875rem;background:var(--bg);border-radius:8px;margin-bottom:8px;}
.comment-meta{font-size:12px;color:var(--gray);margin-bottom:4px;}
.comment-text{font-size:14px;color:var(--text2);line-height:1.6;}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-name">路得行旅 Norden Ruder</div>
      <div class="sidebar-logo-sub">問卷後台管理</div>
    </div>
    <nav class="nav">
      <div class="nav-item active" onclick="goPage('records',this)">
        <span class="nav-icon">📋</span> 填寫紀錄
      </div>
      <div class="nav-item" onclick="goPage('praise',this)">
        <span class="nav-icon">⭐</span> 人員表揚
      </div>
      <div class="nav-item" onclick="goPage('stats',this)">
        <span class="nav-icon">📊</span> 統計分析
      </div>
    </nav>
    <div class="sidebar-branch">
      <div class="branch-label">查看館別</div>
      <select class="branch-select" id="branch-filter" onchange="applyFilter()">
        <option value="all">全部館別</option>
        <option value="taichung">台中館</option>
        <option value="taitung1">台東1館</option>
        <option value="taitung2">台東2館</option>
      </select>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="page-title">填寫紀錄</div>
      <div class="topbar-time" id="top-time"></div>
    </div>
    <div class="content">

      <!-- 填寫紀錄 -->
      <div class="page active" id="page-records">
        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">總填寫數</div>
            <div class="stat-val" id="stat-total">0</div>
            <div class="stat-sub">累計問卷</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">平均整體評分</div>
            <div class="stat-val" id="stat-avg">—</div>
            <div class="stat-sub">滿分 5 分</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">平均 NPS</div>
            <div class="stat-val" id="stat-nps">—</div>
            <div class="stat-sub">滿分 10 分</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">本月問卷數</div>
            <div class="stat-val" id="stat-month">0</div>
            <div class="stat-sub">當月累計</div>
          </div>
        </div>

        <div class="table-card">
          <div class="table-header">
            <div class="table-title">所有填寫紀錄</div>
          </div>
          <input class="search-input" id="search-input" placeholder="搜尋 email..." oninput="renderTable()"/>
          <table>
            <thead>
              <tr>
                <th>Email</th><th>館別</th><th>訂房管道</th><th>整體</th><th>櫃檯</th><th>房務</th><th>NPS</th><th>填寫時間</th>
              </tr>
            </thead>
            <tbody id="records-tbody">
              <tr><td colspan="8"><div class="empty"><div class="empty-icon">📋</div><div class="empty-text">載入中...</div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 人員表揚 -->
      <div class="page" id="page-praise">
        <div class="praise-type-row">
          <button class="filter-btn on" id="btn-desk" onclick="setPraiseType('desk')">櫃檯人員</button>
          <button class="filter-btn" id="btn-room" onclick="setPraiseType('room')">房務人員</button>
        </div>
        <div class="praise-grid" id="praise-grid">
          <div style="grid-column:span 2"><div class="empty"><div class="empty-icon">⭐</div><div class="empty-text">載入中...</div></div></div>
        </div>
      </div>

      <!-- 統計分析 -->
      <div class="page" id="page-stats">
        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">平均整體評分</div>
            <div class="stat-val" id="avg-overall">—</div>
            <div class="stat-sub">/ 5 分</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">平均 NPS</div>
            <div class="stat-val" id="avg-nps">—</div>
            <div class="stat-sub">/ 10 分</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">平均櫃檯評分</div>
            <div class="stat-val" id="avg-desk">—</div>
            <div class="stat-sub">/ 5 分</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">平均房務評分</div>
            <div class="stat-val" id="avg-clean">—</div>
            <div class="stat-sub">/ 5 分</div>
          </div>
        </div>
        <div class="table-card" style="margin-bottom:1.25rem;">
          <div class="table-header"><div class="table-title">訂房管道分佈</div></div>
          <div style="padding:1rem;" id="channel-chart"></div>
        </div>
        <div class="table-card">
          <div class="table-header"><div class="table-title">顧客留言</div></div>
          <div id="comments-list" style="padding:0.75rem 1rem;"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
var API_URL = 'https://norden-ruder-api-production.up.railway.app';
var ADMIN_KEY = 'NR-admin-2026';
var BRANCH_NAME = {taichung:'台中館',taitung1:'台東1館',taitung2:'台東2館',tc:'台中館',tt1:'台東1館',tt2:'台東2館'};
var CHANNEL_NAME = {official:'官網/電話',agoda:'Agoda',booking:'Booking.com',expedia:'Trip.com',other:'其他'};
var ALL_DATA = [];
var praiseType = 'desk';
var branchFilter = 'all';

function authHeaders(){ return {'Content-Type':'application/json','x-admin-key':ADMIN_KEY}; }

async function loadData(){
  try {
    var res = await fetch(API_URL+'/api/submissions?branch=all', {headers:authHeaders()});
    var json = await res.json();
    var raw = json.data || [];
    // 前端自己篩選，避免 taichung/tc 不一致的問題
    if(branchFilter === 'all'){
      ALL_DATA = raw;
    } else {
      var map = {taichung:['taichung','tc'], taitung1:['taitung1','tt1'], taitung2:['taitung2','tt2']};
      var allowed = map[branchFilter] || [branchFilter];
      ALL_DATA = raw.filter(function(r){ return allowed.indexOf(r.branch) >= 0; });
    }
  } catch(e){ ALL_DATA = []; }
}

function goPage(name, el){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
  if(el) el.classList.add('active');
  var titles={records:'填寫紀錄',praise:'人員表揚',stats:'統計分析'};
  document.getElementById('page-title').textContent=titles[name];
  if(name==='records') renderRecords();
  if(name==='praise') renderPraise();
  if(name==='stats') renderStats();
}

function applyFilter(){
  branchFilter = document.getElementById('branch-filter').value;
  loadData().then(function(){ renderAll(); });
}

function renderAll(){ renderRecords(); renderPraise(); renderStats(); }

function renderRecords(){
  var search = (document.getElementById('search-input')||{value:''}).value.toLowerCase();
  var data = ALL_DATA.filter(function(r){
    return !search || r.email.toLowerCase().indexOf(search) >= 0;
  });

  // Stats
  document.getElementById('stat-total').textContent = ALL_DATA.length;
  var avgOv = ALL_DATA.length ? (ALL_DATA.reduce(function(s,r){return s+(r.score_overall||0);},0)/ALL_DATA.length).toFixed(1) : '—';
  document.getElementById('stat-avg').textContent = avgOv;
  var avgNps = ALL_DATA.length ? (ALL_DATA.reduce(function(s,r){return s+(r.nps||0);},0)/ALL_DATA.length).toFixed(1) : '—';
  document.getElementById('stat-nps').textContent = avgNps;
  var now = new Date(); var month = now.getMonth(); var year = now.getFullYear();
  var monthCount = ALL_DATA.filter(function(r){ var d=new Date(r.created_at); return d.getMonth()===month&&d.getFullYear()===year; }).length;
  document.getElementById('stat-month').textContent = monthCount;

  var tb = document.getElementById('records-tbody');
  if(!data.length){
    tb.innerHTML='<tr><td colspan="8"><div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">沒有符合的紀錄</div></div></td></tr>';
    return;
  }
  tb.innerHTML = data.map(function(r){
    var ov = r.score_overall||0;
    var stars = '<span class="star-small">'+'★'.repeat(ov)+'<span style="color:#d0cdc0;">'+'★'.repeat(5-ov)+'</span></span>';
    var dk = r.score_desk||0;
    var dkStars = '<span class="star-small">'+'★'.repeat(dk)+'<span style="color:#d0cdc0;">'+'★'.repeat(5-dk)+'</span></span>';
    var cl = r.score_clean||0;
    var clStars = '<span class="star-small">'+'★'.repeat(cl)+'<span style="color:#d0cdc0;">'+'★'.repeat(5-cl)+'</span></span>';
    var branchKey = r.branch;
    var date = new Date(r.created_at).toLocaleDateString('zh-TW');
    return '<tr><td style="font-size:12px;">'+r.email+'</td><td><span class="badge '+branchKey+'">'+(BRANCH_NAME[branchKey]||branchKey)+'</span></td><td>'+(CHANNEL_NAME[r.channel]||r.channel||'')+'</td><td>'+stars+'</td><td>'+dkStars+'</td><td>'+clStars+'</td><td>'+(r.nps||'')+'</td><td style="font-size:12px;">'+date+'</td></tr>';
  }).join('');
}

function setPraiseType(type){
  praiseType = type;
  document.getElementById('btn-desk').classList.toggle('on', type==='desk');
  document.getElementById('btn-room').classList.toggle('on', type==='room');
  renderPraise();
}

function renderPraise(){
  var counts = {};
  ALL_DATA.forEach(function(r){
    var name = praiseType==='desk' ? r.praise_desk : r.praise_room;
    if(name) counts[name] = (counts[name]||0) + 1;
  });
  var sorted = Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
  var max = sorted.length ? counts[sorted[0]] : 1;
  var grid = document.getElementById('praise-grid');
  if(!sorted.length){
    grid.innerHTML='<div style="grid-column:span 2"><div class="empty"><div class="empty-icon">🏅</div><div class="empty-text">尚無表揚紀錄</div></div></div>';
    return;
  }
  grid.innerHTML = sorted.map(function(name,i){
    var cnt = counts[name];
    var pct = Math.round((cnt/max)*100);
    var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    return '<div class="praise-card"><div class="praise-name">'+medal+' '+name+'</div><div class="praise-count">'+cnt+'</div><div class="praise-label">次被表揚</div><div class="praise-bar"><div class="praise-fill" style="width:'+pct+'%"></div></div></div>';
  }).join('');
}

function renderStats(){
  var data = ALL_DATA;
  if(!data.length){
    ['avg-overall','avg-nps','avg-desk','avg-clean'].forEach(function(id){document.getElementById(id).textContent='—';});
    document.getElementById('channel-chart').innerHTML='';
    document.getElementById('comments-list').innerHTML='<div class="empty"><div class="empty-icon">💬</div><div class="empty-text">尚無資料</div></div>';
    return;
  }
  function avg(arr){ return (arr.reduce(function(s,v){return s+v;},0)/arr.length).toFixed(1); }
  document.getElementById('avg-overall').textContent = avg(data.map(function(r){return r.score_overall||0;}));
  document.getElementById('avg-nps').textContent = avg(data.map(function(r){return r.nps||0;}));
  document.getElementById('avg-desk').textContent = avg(data.map(function(r){return r.score_desk||0;}));
  document.getElementById('avg-clean').textContent = avg(data.map(function(r){return r.score_clean||0;}));

  var chCount = {};
  data.forEach(function(r){ chCount[r.channel]=(chCount[r.channel]||0)+1; });
  var total = data.length;
  document.getElementById('channel-chart').innerHTML = Object.keys(chCount).sort(function(a,b){return chCount[b]-chCount[a];}).map(function(ch){
    var pct = Math.round((chCount[ch]/total)*100);
    return '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>'+(CHANNEL_NAME[ch]||ch)+'</span><span style="color:var(--gray);">'+chCount[ch]+' 筆（'+pct+'%）</span></div><div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;"><div style="height:100%;background:var(--brand);border-radius:3px;width:'+pct+'%;"></div></div></div>';
  }).join('');

  var comments = data.filter(function(r){return r.comment||r.feedback_positive||r.feedback_improve;});
  document.getElementById('comments-list').innerHTML = comments.length ? comments.map(function(r){
    var html = '<div class="comment-item"><div class="comment-meta">'+(BRANCH_NAME[r.branch]||r.branch)+' · '+new Date(r.created_at).toLocaleDateString('zh-TW')+'</div>';
    if(r.feedback_positive) html += '<div style="font-size:12px;color:var(--gray);margin-bottom:2px;">✨ 滿意之處</div><div class="comment-text">'+r.feedback_positive+'</div>';
    if(r.feedback_improve) html += '<div style="font-size:12px;color:var(--gray);margin:8px 0 2px;">🙏 改善建議</div><div class="comment-text">'+r.feedback_improve+'</div>';
    if(r.comment) html += '<div style="font-size:12px;color:var(--gray);margin:8px 0 2px;">💬 其他留言</div><div class="comment-text">'+r.comment+'</div>';
    html += '</div>';
    return html;
  }).join('') : '<div class="empty"><div class="empty-icon">💬</div><div class="empty-text">尚無顧客留言</div></div>';

function tick(){
  var now=new Date();
  document.getElementById('top-time').textContent=now.getFullYear()+'/'+(now.getMonth()+1).toString().padStart(2,'0')+'/'+now.getDate().toString().padStart(2,'0')+' '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
}
tick(); setInterval(tick,1000);

loadData().then(function(){ renderAll(); });
</script>
</body>
</html>
